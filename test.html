<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Google Sans', Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #202124;
      font-size: 13px;
    }

    .validasi-box {
      background: #e8f0fe;
      border: 1px solid #d2e3fc;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* min-width:0 wajib supaya flex item ini boleh menyusut & membungkus teks,
       bukan malah mendorong .badge keluar container saat teks "Tab: ..." panjang */
    .validasi-box .lokasi {
      font-weight: 600;
      font-size: 13px;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .validasi-box .lokasi small {
      display: block;
      font-weight: 400;
      color: #5f6368;
      font-size: 11px;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
      /* cegah badge melebar saat kolomLabel kebetulan panjang (mis. URL) */
      flex-shrink: 0;
      background: #4f46e5;
    }

    .info-box {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #e8eaed;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      gap: 10px;
    }

    .info-label {
      color: #5f6368;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .info-value {
      font-weight: 600;
      text-align: right;
      max-width: 65%;
      word-break: break-word;
      /* batasi maksimal 2 baris + "..." supaya teks panjang (mis. URL) tidak
         membuat info-box melonjak tinggi; hover untuk lihat teks lengkap */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .drop-area {
      border: 2px dashed #c8cbd0;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      color: #5f6368;
      margin-bottom: 12px;
    }

    .drop-area:hover {
      background: #f8f9fa;
      border-color: #1a73e8;
    }

    input[type=file] {
      display: none;
    }

    .file-list {
      max-height: 170px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #e8eaed;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .file-icon {
      font-size: 16px;
    }

    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-status {
      font-size: 11px;
      min-width: 90px;
      text-align: right;
    }

    .status-waiting {
      color: #9aa0a6;
    }

    .status-uploading {
      color: #1a73e8;
    }

    .status-done {
      color: #1e8e3e;
      font-weight: 600;
    }

    .status-error {
      color: #c5221f;
      font-weight: 600;
    }

    .spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid #d2e3fc;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .overall-wrap {
      margin: 14px 0 10px;
    }

    .overall-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #5f6368;
    }

    .progress-track {
      background: #e8eaed;
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      background: #1a73e8;
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: #1a73e8;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #a9c6f5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f1f3f4;
      color: #202124;
    }

    .final-msg {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      font-weight: 500;
    }

    .final-msg.ok {
      color: #1e8e3e;
    }

    .final-msg.err {
      color: #c5221f;
    }
  </style>
</head>

<body>

  <div class="validasi-box">
    <div class="lokasi">
      📄 Tab:
      <?= sheetName ?> — Baris
      <?= row ?>
      <small>Pastikan tab, kolom (PIC), dan tanggal di bawah sudah benar sebelum upload</small>
    </div>
    <span class="badge" title="<?= kolomLabel ?>">
      <?= kolomLabel ?>
    </span>
  </div>

  <div class="info-box">
    <div class="info-row"><span class="info-label">Kolom (PIC)</span><span class="info-value" title="<?= kolomLabel ?>">
        <?= kolomLabel ?>
      </span></div>
    <div class="info-row"><span class="info-label">Tanggal</span><span class="info-value">
        <?= tanggalDisplay ?>
      </span></div>
    <? if (existingCount > 0) { ?>
    <div class="info-row"><span class="info-label">Evidence sudah ada</span><span class="info-value">
        <?= existingCount ?> file
      </span></div>
    <? } ?>
  </div>

  <div class="drop-area" id="dropArea">
    📎 Klik untuk pilih file (bisa pilih banyak sekaligus)<br>
    <small>Maks
      <?= maxFileMb ?>MB per file
    </small>
  </div>
  <input type="file" id="fileInput" multiple>

  <div class="file-list" id="fileList"></div>

  <div class="overall-wrap" id="overallWrap" style="display:none;">
    <div class="overall-label"><span id="overallText">Mengupload...</span><span id="overallPct">0%</span></div>
    <div class="progress-track">
      <div class="progress-fill" id="overallFill"></div>
    </div>
  </div>

  <div id="finalMsg"></div>

  <div class="btn-row">
    <button class="btn-secondary" id="cancelBtn">Batal</button>
    <button class="btn-primary" id="uploadBtn" disabled>🚀 Mulai Upload</button>
  </div>

  <script>
    const META_BASE = <?!= JSON.stringify({
      sheetName: sheetName,
      row: row,
      col: col,
      folderId: folderId,
      cacheKey: cacheKey
    }) ?>;
    const MAX_MB = <?= maxFileMb ?>;

    let selectedFiles = [];

    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const uploadBtn = document.getElementById('uploadBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    dropArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      renderFileList();
      uploadBtn.disabled = selectedFiles.length === 0;
    });

    function fileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return '🖼️';
      if (ext === 'pdf') return '📄';
      return '📎';
    }

    function renderFileList() {
      fileListEl.innerHTML = '';
      selectedFiles.forEach((f, i) => {
        const oversized = f.size > MAX_MB * 1024 * 1024;
        const row = document.createElement('div');
        row.className = 'file-item';
        row.id = 'file-row-' + i;
        row.innerHTML =
          '<span class="file-icon">' + fileIcon(f.name) + '</span>' +
          '<span class="file-name" title="' + f.name + '">' + f.name + '</span>' +
          '<span class="file-status ' + (oversized ? 'status-error' : 'status-waiting') + '" id="file-status-' + i + '">' +
          (oversized ? 'Terlalu besar' : 'Menunggu') + '</span>';
        fileListEl.appendChild(row);
      });
    }

    function setFileStatus(i, statusClass, html) {
      const el = document.getElementById('file-status-' + i);
      if (el) { el.className = 'file-status ' + statusClass; el.innerHTML = html; }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = () => reject(new Error('Gagal membaca file'));
        reader.readAsDataURL(file);
      });
    }

    function serverUpload(base64, mimeType, name, index) {
      return new Promise((resolve) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((err) => resolve({ success: false, error: err.message || String(err) }))
          .uploadSingleFileEvidence(base64, mimeType, name, index, META_BASE);
      });
    }

    function updateOverall(done, total) {
      const pct = Math.round((done / total) * 100);
      document.getElementById('overallFill').style.width = pct + '%';
      document.getElementById('overallPct').innerText = pct + '%';
      document.getElementById('overallText').innerText = 'Mengupload ' + done + ' dari ' + total + ' file';
    }

    uploadBtn.addEventListener('click', async () => {
      const uploadable = selectedFiles
        .map((f, i) => ({ f, i }))
        .filter(x => x.f.size <= MAX_MB * 1024 * 1024);

      if (uploadable.length === 0) {
        document.getElementById('finalMsg').innerHTML = '<div class="final-msg err">Tidak ada file valid untuk diupload.</div>';
        return;
      }

      uploadBtn.disabled = true;
      cancelBtn.disabled = true;
      document.getElementById('overallWrap').style.display = 'block';

      const results = [];
      let doneCount = 0;

      for (const item of uploadable) {
        setFileStatus(item.i, 'status-uploading', '<span class="spinner"></span>Mengupload');
        try {
          const base64 = await readFileAsBase64(item.f);
          const res = await serverUpload(base64, item.f.type || 'application/octet-stream', item.f.name, item.i + 1);
          if (res && res.success) {
            setFileStatus(item.i, 'status-done', '✅ Selesai');
            results.push(res);
          } else {
            setFileStatus(item.i, 'status-error', '❌ ' + (res.error || 'Gagal'));
          }
        } catch (err) {
          setFileStatus(item.i, 'status-error', '❌ Gagal');
        }
        doneCount++;
        updateOverall(doneCount, uploadable.length);
      }

      const successResults = results.map(r => ({ label: r.label, url: r.url }));

      if (successResults.length > 0) {
        google.script.run
          .withSuccessHandler(() => {
            const failedCount = uploadable.length - successResults.length;
            const msg = failedCount > 0
              ? successResults.length + ' file berhasil, ' + failedCount + ' gagal.'
              : successResults.length + ' file berhasil diupload!';
            document.getElementById('finalMsg').innerHTML = '<div class="final-msg ok">✅ ' + msg + '</div>';
            setTimeout(() => google.script.host.close(), 1600);
          })
          .withFailureHandler((err) => {
            document.getElementById('finalMsg').innerHTML = '<div class="final-msg err">File terupload tapi gagal menyimpan link ke sel: ' + err.message + '</div>';
          })
          .finalizeEvidenceUploadCell(META_BASE, successResults);
      } else {
        document.getElementById('finalMsg').innerHTML = '<div class="final-msg err">❌ Semua file gagal diupload. Coba lagi.</div>';
        uploadBtn.disabled = false;
        cancelBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener('click', () => {
      google.script.host.close();
    });
  </script>
</body>

</html>
